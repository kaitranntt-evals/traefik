---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: http-empty
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-wildcard
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-foo
      protocol: HTTP
      port: 80
      hostname: "foo.example.com"
      allowedRoutes:
        namespaces:
          from: Same

---
kind: GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: route-empty
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: http-empty
  rules:
    - backendRefs:
        - name: whoami
          port: 80
          weight: 1

---
kind: GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: route-wildcard
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: http-wildcard
  rules:
    - backendRefs:
        - name: whoami
          port: 80
          weight: 1

---
kind: GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: route-foo
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: http-foo
  rules:
    - backendRefs:
        - name: whoami
          port: 80
          weight: 1

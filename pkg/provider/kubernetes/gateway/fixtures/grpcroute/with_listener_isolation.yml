---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
# Listeners sharing a port are isolated: a request is only served by the routes
# of the listener with the most specific hostname matching it.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: wildcard-example-com
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        kinds:
          - kind: GRPCRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same
    - name: abc-example-com
      protocol: HTTP
      port: 80
      hostname: "abc.example.com"
      allowedRoutes:
        kinds:
          - kind: GRPCRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same

---
kind: GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-wildcard-example-com
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: wildcard-example-com
  rules:
    - backendRefs:
        - name: whoami
          port: 80
          weight: 1

---
kind: GRPCRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-abc-example-com
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: abc-example-com
  rules:
    - backendRefs:
        - name: whoami
          port: 80
          weight: 1

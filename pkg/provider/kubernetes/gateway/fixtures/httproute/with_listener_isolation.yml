---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
# Listeners sharing a port are isolated: a request is only served by the routes
# of the listener with the most specific hostname matching it.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: empty-hostname
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: wildcard-example-com
      protocol: HTTP
      port: 80
      hostname: "*.example.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: wildcard-foo-example-com
      protocol: HTTP
      port: 80
      hostname: "*.foo.example.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: abc-foo-example-com
      protocol: HTTP
      port: 80
      hostname: "abc.foo.example.com"
      allowedRoutes:
        namespaces:
          from: Same

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-empty-hostname
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: empty-hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /empty-hostname
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

---
# The intersection with the listener hostname keeps the hostnames of the more specific
# listeners, which the isolation prevents from matching.
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-wildcard-example-com
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: wildcard-example-com
  hostnames:
    - "bar.com"
    - "*.example.com"
    - "*.foo.example.com"
    - "abc.foo.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /wildcard-example-com
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-abc-foo-example-com
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: abc-foo-example-com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /abc-foo-example-com
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

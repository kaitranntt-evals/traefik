---
apiVersion: v1
kind: Secret
metadata:
  name: supersecret
  namespace: default

data:
  tls.crt: 
  tls.key: 

---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway-class
spec:
  controllerName: traefik.io/gateway-controller

---
# HTTPS listeners sharing a port are isolated, and the requests whose TLS connection
# was established (SNI) for another listener than the one matching their Host are
# misdirected: they are rejected with a 421 status.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: my-gateway
  namespace: default
spec:
  gatewayClassName: my-gateway-class
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-with-hostname
      protocol: HTTPS
      port: 443
      hostname: second-example.org
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-with-wildcard-hostname
      protocol: HTTPS
      port: 443
      hostname: "*.wildcard.org"
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-with-hostname-matching-wildcard
      protocol: HTTPS
      port: 443
      hostname: fourth-example.wildcard.org
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
    # Alone on its port, this listener is not isolated from the others.
    - name: https-alone
      protocol: HTTPS
      port: 8443
      hostname: alone.example.org
      tls:
        certificateRefs:
          - kind: Secret
            name: supersecret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-https
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https
  hostnames:
    - example.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: attaches-to-https-with-wildcard-hostname
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-with-wildcard-hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
          weight: 1
          kind: Service
          group: ""

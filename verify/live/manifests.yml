apiVersion: v1
kind: Service
metadata: {name: backend, namespace: default}
spec:
  type: ExternalName
  externalName: localhost
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: Secret
metadata: {name: digest-users, namespace: default}
stringData:
  users: |
    dana:traefik:36201d66a1d6247c752ef2724940e6a4
---
apiVersion: v1
kind: Secret
metadata: {name: basic-users, namespace: default}
stringData:
  users: |
    alice:{SHA}A9TywlKQ52FmOm3kIZ5P/nP9eoU=
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: digest, namespace: default}
spec: {digestAuth: {secret: digest-users}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: basic, namespace: default}
spec: {basicAuth: {secret: basic-users}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: routes, namespace: default}
spec:
  entryPoints: [web]
  routes:
  - match: PathPrefix(`/digest`)
    kind: Rule
    middlewares: [{name: digest}]
    services: [{name: backend, port: 9000}]
  - match: PathPrefix(`/basic`)
    kind: Rule
    middlewares: [{name: basic}]
    services: [{name: backend, port: 9000}]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: {name: nginx}
spec: {controller: k8s.io/ingress-nginx}
---
apiVersion: v1
kind: Secret
metadata: {name: nginx-file, namespace: default}
stringData:
  auth: "  nina:{SHA}mS4y8v0FeinwTQILZwjk658Q8BU=  \n"
---
apiVersion: v1
kind: Secret
metadata: {name: nginx-map, namespace: default}
stringData:
  zed: "{SHA}oDOmCkKs1/rnAoJpyrH/z1tsJQw="
  amy: "{SHA}OwvDLVqCSOBLOsN9l+C4+v0DbhU="
  mia: "{SHA}uRAtdmFwZASUhvuBoadhopViHIQ="
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngfile
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: nginx-file
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
spec:
  ingressClassName: nginx
  rules:
  - host: file.example.com
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 9000}}}}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngmap
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: nginx-map
    nginx.ingress.kubernetes.io/auth-secret-type: auth-map
spec:
  ingressClassName: nginx
  rules:
  - host: map.example.com
    http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 9000}}}}]}
